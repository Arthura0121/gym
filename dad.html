<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout — Watching</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="role-dad">

<div class="wrap">

  <div class="topbar">
    <div class="brand">GRIND<span>SET</span></div>
    <div class="badge live" id="statusBadge">WATCHING</div>
  </div>

  <button class="btn full" id="soundUnlockBtn" style="border-color:var(--spectator); color:var(--spectator);">
    🔊 Tap to enable rest-timer alert sound
  </button>

  <div class="dial-card">
    <div class="dial-wrap">
      <svg viewBox="0 0 232 232">
        <circle class="dial-track" cx="116" cy="116" r="100"></circle>
        <circle class="dial-fill" id="dialFill" cx="116" cy="116" r="100"
                stroke-dasharray="628" stroke-dashoffset="628"></circle>
      </svg>
      <div class="dial-center">
        <div class="dial-reps"><span id="repsDone">0</span><small> / <span id="repsTotal">720</span></small></div>
        <div class="dial-sub">reps</div>
        <div class="dial-set" id="setLabel">SET 1 / 24</div>
      </div>
    </div>

    <div class="pips" id="pips"></div>
  </div>

  <div class="break-banner" id="breakBanner">
    <div>
      <div class="label">He's resting</div>
      <div class="time" id="breakTime">0:45</div>
    </div>
  </div>

  <div class="complete-banner" id="completeBanner">
    <div class="title">WORKOUT COMPLETE 🔥</div>
    <div class="sub" id="completeSub"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Elapsed</div>
      <div class="stat-value" id="elapsedVal">0:00</div>
    </div>
    <div class="stat">
      <div class="stat-label">Reps left</div>
      <div class="stat-value" id="repsLeftVal">720</div>
    </div>
    <div class="stat">
      <div class="stat-label">Status</div>
      <div class="stat-value" id="statusVal">Idle</div>
    </div>
    <div class="stat">
      <div class="stat-label">Sets done</div>
      <div class="stat-value" id="setsVal">0 / 24</div>
    </div>
  </div>

  <div class="start-card" id="idleHint">Nothing happening yet — waiting for him to hit start.</div>

  <footer class="foot">SPECTATOR VIEW &middot; <span id="syncMode">local</span></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/engine.js"></script>
<script src="js/sync.js"></script>
<script src="js/sound.js"></script>
<script src="js/dad.js"></script>
</body>
</html>
